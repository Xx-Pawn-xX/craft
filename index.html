<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

  <title>Craft</title>

  <link rel="stylesheet" href="./style.css" />
</head>

<body>

  <div id="loading">
    <h1>CRAFT</h1>
    <p>Tap PLAY to enter the world</p>
    <button id="playButton">PLAY</button>
  </div>

  <div id="crosshair">
    <div></div>
    <span></span>
  </div>

  <div id="ui">

    <div id="info">
      <strong>CRAFT</strong>
      <span id="coords">X: 0 Y: 0 Z: 0</span>
    </div>

    <div id="mobileControls">

      <div id="joystickArea">
        <div id="joystickBase">
          <div id="joystickKnob"></div>
        </div>
      </div>

      <div id="rightControls">

        <div class="actionRow">
          <button id="jumpButton" class="controlButton big">▲</button>
        </div>

        <div class="actionRow">
          <button id="breakButton" class="controlButton danger">
            ⛏
          </button>

          <button id="placeButton" class="controlButton">
            🧱
          </button>
        </div>

      </div>

    </div>

    <div id="hotbar">
      <button class="slot active" data-block="grass">
        <span>1</span>
        🟩
      </button>

      <button class="slot" data-block="dirt">
        <span>2</span>
        🟫
      </button>

      <button class="slot" data-block="stone">
        <span>3</span>
        ⬜
      </button>

      <button class="slot" data-block="wood">
        <span>4</span>
        🟤
      </button>

      <button class="slot" data-block="leaves">
        <span>5</span>
        🟢
      </button>
    </div>

  </div>

  <script type="module" src="./game.js"></script>

</body>
</html>
